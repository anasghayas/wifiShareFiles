<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Share files with friends over campus WiFi">
    <title>wifiShare — Campus File Sharing</title>

    <!-- 
        WHAT: Loading a modern font from Google Fonts
        WHY:  Default browser fonts look boring and outdated.
              'Inter' is a clean, modern font used by many popular apps.
        HOW:  The browser downloads this font from Google's servers
              and uses it instead of the default font.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ============================================
           CSS = Cascading Style Sheets
           This is what makes the page LOOK good.
           Without CSS, the page would be plain black text
           on a white background (ugly!).
           ============================================ */

        /* '*' means "apply to ALL elements" */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box; /* Makes width/height calculations easier */
        }

        body {
            font-family: 'Inter', sans-serif;
            /* A dark gradient background — two colors blending into each other */
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
            min-height: 100vh; /* vh = viewport height. 100vh = full screen height */
            padding: 2rem;    /* rem = relative to root font size. 2rem ≈ 32px */
        }

        .container {
            max-width: 800px;
            margin: 0 auto; /* auto left/right margin = centered horizontally */
        }

        /* ---- HEADER ---- */
        h1 {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 700;
            /* Gradient text effect — the text itself has a color gradient */
            background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            text-align: center;
            color: #9ca3af;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        /* ---- UPLOAD ZONE ---- */
        /* 
            This is the drag-and-drop area.
            'dashed border' = the dotted outline you see.
            We change its look when you drag a file over it (via JavaScript).
        */
        .upload-zone {
            border: 2px dashed #4b5563;
            border-radius: 16px;  /* Rounded corners */
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;       /* Shows a hand cursor when you hover */
            transition: all 0.3s ease; /* Smooth animation when styles change */
            /* Glassmorphism effect — semi-transparent with blur */
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            margin-bottom: 2rem;
        }

        /* ':hover' = when mouse is over the element */
        .upload-zone:hover {
            border-color: #a78bfa;
            background: rgba(167, 139, 250, 0.05);
        }

        /* '.drag-over' class is added by JavaScript when you drag a file over */
        .upload-zone.drag-over {
            border-color: #34d399;
            background: rgba(52, 211, 153, 0.1);
            transform: scale(1.02); /* Slightly bigger */
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .upload-text {
            font-size: 1.1rem;
            color: #d1d5db;
            margin-bottom: 0.5rem;
        }

        .upload-hint {
            font-size: 0.85rem;
            color: #6b7280;
        }

        /* Hidden file input — we use JavaScript to trigger it */
        .file-input {
            display: none;
        }

        /* ---- PROGRESS BAR ---- */
        .progress-container {
            display: none; /* Hidden by default, shown during upload */
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: #1f2937;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 0.75rem;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #a78bfa, #34d399);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 0.9rem;
            color: #9ca3af;
        }

        /* ---- STATUS MESSAGE ---- */
        .status {
            text-align: center;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none; /* Hidden by default */
            font-size: 0.9rem;
            animation: fadeIn 0.3s ease;
        }

        .status.success {
            display: block;
            background: rgba(52, 211, 153, 0.1);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        .status.error {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        /* ---- FILE LIST ---- */
        .files-section {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .files-header {
            display: flex;                  /* Flexbox = easy horizontal layout */
            justify-content: space-between; /* Push items to opposite ends */
            align-items: center;
            margin-bottom: 1rem;
        }

        .files-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #e5e7eb;
        }

        .refresh-btn {
            background: rgba(167, 139, 250, 0.1);
            color: #a78bfa;
            border: 1px solid rgba(167, 139, 250, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }

        .refresh-btn:hover {
            background: rgba(167, 139, 250, 0.2);
        }

        .file-list {
            list-style: none; /* Remove bullet points */
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 0.5rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.2s ease;
        }

        .file-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 0.75rem; /* Space between child elements */
            min-width: 0;  /* Allows text to shrink/truncate */
        }

        .file-icon {
            font-size: 1.5rem;
            flex-shrink: 0; /* Don't let the icon shrink */
        }

        .file-name {
            font-weight: 500;
            color: #e5e7eb;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; /* Shows "..." if name is too long */
        }

        .file-size {
            font-size: 0.8rem;
            color: #6b7280;
        }

        .download-btn {
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            color: white;
            border: none;
            padding: 0.5rem 1.25rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .download-btn:hover {
            transform: translateY(-1px); /* Slight lift effect */
            box-shadow: 0 4px 15px rgba(167, 139, 250, 0.3);
        }

        .file-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.25);
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.25);
            border-color: #ef4444;
            transform: translateY(-1px);
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #6b7280;
        }

        .empty-state .empty-icon {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
        }

        /* ---- ADMIN BAR ---- */
        .admin-bar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.85rem 1.25rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }

        .admin-bar.locked {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .admin-bar.unlocked {
            background: rgba(52, 211, 153, 0.08);
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        .admin-status {
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .admin-label {
            font-size: 0.85rem;
            font-weight: 500;
            flex-shrink: 0;
        }

        .admin-bar.locked .admin-label { color: #f87171; }
        .admin-bar.unlocked .admin-label { color: #34d399; }

        .admin-password-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 0.45rem 0.75rem;
            color: #e5e7eb;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .admin-password-input:focus {
            border-color: #a78bfa;
        }

        .admin-password-input::placeholder {
            color: #6b7280;
        }

        .admin-btn {
            padding: 0.45rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            border: none;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .admin-btn.unlock {
            background: linear-gradient(135deg, #34d399, #06b6d4);
            color: white;
        }

        .admin-btn.unlock:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(52, 211, 153, 0.3);
        }

        .admin-btn.lock {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.25);
        }

        .admin-btn.lock:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        /* ---- ANIMATIONS ---- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ---- RESPONSIVE ---- */
        /* When screen is smaller than 600px (mobile phones) */
        @media (max-width: 600px) {
            body { padding: 1rem; }
            h1 { font-size: 1.75rem; }
            .upload-zone { padding: 2rem 1rem; }
            .file-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.75rem;
            }
            .file-actions { width: 100%; }
            .download-btn { flex: 1; text-align: center; }
            .admin-bar { flex-wrap: wrap; }
            .admin-password-input { min-width: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📁 wifiShare</h1>
        <p class="subtitle">Drop files here to share with friends on campus</p>

        <!-- Admin Bar -->
        <div class="admin-bar locked" id="adminBar">
            <span class="admin-status" id="adminIcon">🔒</span>
            <span class="admin-label" id="adminLabel">Locked</span>
            <input type="password" class="admin-password-input" id="adminPassword" placeholder="Enter admin password...">
            <button class="admin-btn unlock" id="adminBtn" onclick="toggleAuth()">Unlock</button>
        </div>

        <!-- Upload Zone -->
        <div class="upload-zone" id="uploadZone">
            <div class="upload-icon">☁️</div>
            <p class="upload-text">Drag & drop files here</p>
            <p class="upload-hint">or click to browse • Max 5GB per file</p>
            <input type="file" class="file-input" id="fileInput" multiple>
        </div>

        <!-- Progress Bar (hidden by default) -->
        <div class="progress-container" id="progressContainer">
            <span class="progress-text" id="progressText">Uploading...</span>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <!-- Status Message (hidden by default) -->
        <div class="status" id="statusMessage"></div>

        <!-- File List -->
        <div class="files-section">
            <div class="files-header">
                <h2>📂 Shared Files</h2>
                <button class="refresh-btn" id="refreshBtn" onclick="loadFiles()">↻ Refresh</button>
            </div>
            <ul class="file-list" id="fileList">
                <li class="empty-state">
                    <div class="empty-icon">📭</div>
                    <p>No files shared yet. Upload something!</p>
                </li>
            </ul>
        </div>
    </div>

    <!--
        ============================================
        JAVASCRIPT
        This is what makes the page INTERACTIVE.
        Without JS, clicking buttons wouldn't do anything.
        
        JS runs IN THE BROWSER (on your friend's device),
        not on your server. It sends HTTP requests to your
        Go server to upload/download files.
        ============================================
    -->
    <script>
        // ---- REFERENCES TO HTML ELEMENTS ----
        // document.getElementById finds an element by its 'id' attribute
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const statusMessage = document.getElementById('statusMessage');
        const fileList = document.getElementById('fileList');

        // ---- DRAG AND DROP ----
        // These events fire when you drag a file over the upload zone
        
        // 'dragover' = file is hovering over the zone
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault(); // Prevent browser's default behavior (opening the file)
            uploadZone.classList.add('drag-over'); // Add green highlight
        });

        // 'dragleave' = file left the zone without being dropped
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('drag-over'); // Remove green highlight
        });

        // 'drop' = file was released over the zone
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('drag-over');
            const files = e.dataTransfer.files; // Get the dropped files
            if (files.length > 0) {
                handleFiles(files); // Process them
            }
        });

        // 'click' on upload zone = open file browser dialog
        uploadZone.addEventListener('click', () => {
            fileInput.click(); // Trigger the hidden file input
        });

        // When files are selected via the file browser dialog
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFiles(e.target.files);
            }
        });

        // ---- ADMIN AUTH ----
        // getAuthHeaders() returns the password header to include in protected requests.
        // sessionStorage = browser storage that clears when you close the tab.
        // This means you stay "logged in" across page refreshes, but not forever.
        function getAuthHeaders() {
            const pw = sessionStorage.getItem('adminPassword');
            if (pw) {
                return { 'X-Admin-Password': pw };
            }
            return {};
        }

        // Toggle between locked/unlocked state
        function toggleAuth() {
            const bar = document.getElementById('adminBar');
            const icon = document.getElementById('adminIcon');
            const label = document.getElementById('adminLabel');
            const input = document.getElementById('adminPassword');
            const btn = document.getElementById('adminBtn');

            if (bar.classList.contains('locked')) {
                // Trying to UNLOCK
                const pw = input.value.trim();
                if (!pw) {
                    showStatus('❌ Please enter a password', 'error');
                    return;
                }
                sessionStorage.setItem('adminPassword', pw);
                bar.classList.remove('locked');
                bar.classList.add('unlocked');
                icon.textContent = '🔓';
                label.textContent = 'Unlocked';
                input.style.display = 'none';
                btn.textContent = 'Lock';
                btn.className = 'admin-btn lock';
                showStatus('🔓 Admin access unlocked!', 'success');
            } else {
                // Trying to LOCK
                sessionStorage.removeItem('adminPassword');
                bar.classList.remove('unlocked');
                bar.classList.add('locked');
                icon.textContent = '🔒';
                label.textContent = 'Locked';
                input.value = '';
                input.style.display = '';
                btn.textContent = 'Unlock';
                btn.className = 'admin-btn unlock';
                showStatus('🔒 Admin access locked', 'success');
            }
        }

        // Allow pressing Enter in the password field to unlock
        document.getElementById('adminPassword').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') toggleAuth();
        });

        // Restore admin state from sessionStorage on page load
        (function restoreAuthState() {
            const pw = sessionStorage.getItem('adminPassword');
            if (pw) {
                const bar = document.getElementById('adminBar');
                const icon = document.getElementById('adminIcon');
                const label = document.getElementById('adminLabel');
                const input = document.getElementById('adminPassword');
                const btn = document.getElementById('adminBtn');
                bar.classList.remove('locked');
                bar.classList.add('unlocked');
                icon.textContent = '🔓';
                label.textContent = 'Unlocked';
                input.style.display = 'none';
                btn.textContent = 'Lock';
                btn.className = 'admin-btn lock';
            }
        })();

        // ---- FILE UPLOAD (CHUNKED FOR LARGE FILES) ----
        const CHUNK_SIZE = 10 * 1024 * 1024; // 10MB per chunk

        async function handleFiles(files) {
            // Upload each selected file one after another
            for (const file of files) {
                await uploadFile(file);
            }
        }

        async function uploadFile(file) {
            const totalChunks = Math.ceil(file.size / CHUNK_SIZE);

            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';
            progressText.textContent = `Preparing "${file.name}" (0/${totalChunks} chunks)...`;

            for (let chunkIdx = 0; chunkIdx < totalChunks; chunkIdx++) {
                const start = chunkIdx * CHUNK_SIZE;
                const end = Math.min(start + CHUNK_SIZE, file.size);
                const chunkBlob = file.slice(start, end);

                const formData = new FormData();
                formData.append('file', chunkBlob, file.name);
                formData.append('filename', file.name);
                formData.append('chunkIndex', chunkIdx.toString());
                formData.append('totalChunks', totalChunks.toString());

                let success = false;
                let lastErr = '';

                // Retry each 10MB chunk up to 3 times in case campus WiFi drops a packet
                for (let attempt = 1; attempt <= 3; attempt++) {
                    try {
                        const res = await fetch('/upload/chunk', {
                            method: 'POST',
                            headers: getAuthHeaders(),
                            body: formData
                        });

                        if (res.status === 401) {
                            throw new Error('Wrong admin password — unlock first!');
                        }
                        if (!res.ok) {
                            const errText = await res.text();
                            throw new Error(errText || `HTTP ${res.status}`);
                        }

                        success = true;
                        break;
                    } catch (err) {
                        lastErr = err.message;
                        if (attempt < 3) {
                            progressText.textContent = `Retrying chunk ${chunkIdx + 1}/${totalChunks} (Attempt ${attempt + 1}/3)...`;
                            await new Promise(r => setTimeout(r, 1000));
                        }
                    }
                }

                if (!success) {
                    progressContainer.style.display = 'none';
                    showStatus(`❌ Failed at chunk ${chunkIdx + 1}/${totalChunks}: ${lastErr}`, 'error');
                    return;
                }

                const percent = Math.round(((chunkIdx + 1) / totalChunks) * 100);
                progressBar.style.width = percent + '%';
                progressText.textContent = `Uploading "${file.name}"... ${percent}% (${chunkIdx + 1}/${totalChunks} chunks)`;
            }

            // All chunks received by Go server! Ask server to assemble them into the final file
            progressText.textContent = `Assembling "${file.name}" on server...`;
            try {
                const completeForm = new FormData();
                completeForm.append('filename', file.name);

                const completeRes = await fetch('/upload/complete', {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: completeForm
                });

                progressContainer.style.display = 'none';

                if (completeRes.ok) {
                    showStatus(`✅ "${file.name}" uploaded successfully!`, 'success');
                    loadFiles(); // Refresh file list
                } else {
                    const errText = await completeRes.text();
                    showStatus(`❌ Merge failed for "${file.name}": ${errText}`, 'error');
                }
            } catch (err) {
                progressContainer.style.display = 'none';
                showStatus(`❌ Assembly request failed: ${err.message}`, 'error');
            }
        }

        // ---- STATUS MESSAGES ----
        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = 'status ' + type;
            setTimeout(() => {
                statusMessage.style.display = 'none';
            }, 4500);
        }

        // ---- DELETE FILE ----
        async function deleteFile(encodedFilename) {
            const filename = decodeURIComponent(encodedFilename);
            if (!confirm(`Are you sure you want to delete "${filename}"?`)) {
                return;
            }
            try {
                const res = await fetch(`/delete/${encodedFilename}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });
                if (res.ok) {
                    showStatus(`🗑️ "${filename}" deleted!`, 'success');
                    loadFiles();
                } else {
                    const errText = await res.text();
                    showStatus(`❌ Failed to delete "${filename}": ${errText}`, 'error');
                }
            } catch (err) {
                showStatus(`❌ Error deleting "${filename}": ${err.message}`, 'error');
            }
        }

        // ---- LOAD FILE LIST ----
        function loadFiles() {
            fetch('/files')
                .then(response => response.json())
                .then(files => {
                    if (files.length === 0) {
                        fileList.innerHTML = `
                            <li class="empty-state">
                                <div class="empty-icon">📭</div>
                                <p>No files shared yet. Upload something!</p>
                            </li>`;
                        return;
                    }

                    fileList.innerHTML = ''; // Clear list

                    files.forEach(file => {
                        const li = document.createElement('li');
                        li.className = 'file-item';
                        li.innerHTML = `
                            <div class="file-info">
                                <span class="file-icon">${getFileIcon(file.name)}</span>
                                <div>
                                    <div class="file-name">${file.name}</div>
                                    <div class="file-size">${file.size}</div>
                                </div>
                            </div>
                            <div class="file-actions">
                                <a href="/download/${encodeURIComponent(file.name)}" class="download-btn">⬇ Download</a>
                                <button onclick="deleteFile('${encodeURIComponent(file.name)}')" class="delete-btn" title="Delete file">🗑️</button>
                            </div>`;
                        fileList.appendChild(li);
                    });
                })
                .catch(() => {
                    console.log('Could not load files');
                });
        }

        // ---- FILE ICON PICKER ----
        // Returns an emoji based on the file extension
        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const icons = {
                'pdf': '📕', 'doc': '📘', 'docx': '📘', 'txt': '📄',
                'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🖼️', 'svg': '🖼️',
                'mp4': '🎬', 'avi': '🎬', 'mkv': '🎬', 'mov': '🎬',
                'mp3': '🎵', 'wav': '🎵', 'flac': '🎵',
                'zip': '📦', 'rar': '📦', '7z': '📦', 'tar': '📦', 'gz': '📦',
                'py': '🐍', 'go': '🐹', 'js': '⚡', 'html': '🌐', 'css': '🎨',
                'pptx': '📊', 'ppt': '📊', 'xlsx': '📗', 'xls': '📗', 'csv': '📗',

        }

        loadFiles();
